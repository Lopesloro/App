# Toda action e fixada em SHA de commit, nao em tag.
# Uma tag como @v4 pode ser reapontada pelo dono do repositorio (ou por quem
# o comprometer) para codigo diferente, que rodaria aqui com acesso aos
# segredos do repositorio. SHA de commit e imutavel. O comentario ao lado
# registra a versao correspondente, e o Dependabot atualiza os dois juntos.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detecta se o codigo do app ja existe (Fase 1+). Enquanto o repo for
  # somente documentacao, os jobs de build/teste passam sem executar.
  detectar:
    name: detectar
    runs-on: ubuntu-latest
    outputs:
      tem_app: ${{ steps.check.outputs.tem_app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "tem_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem_app=false" >> "$GITHUB_OUTPUT"
          fi

  qualidade:
    name: qualidade
    needs: detectar
    runs-on: ubuntu-latest
    steps:
      # Historico completo: o commitlint precisa alcancar o commit base do PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - if: needs.detectar.outputs.tem_app == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # `npm ci` seria o ideal, mas ele exige que o lock ja contenha as
      # dependencias opcionais de TODAS as plataformas. O fallback wasm do
      # resolver do eslint (@unrs/resolver-binding-wasm32-wasi -> @emnapi/*)
      # so e resolvido no Linux, e nao ha como gerar essas entradas a partir
      # do Windows — nem com --os/--cpu/--libc. `npm install` respeita o
      # package-lock.json para tudo que esta travado e apenas reconcilia os
      # binarios da plataforma. Voltar para `npm ci` quando o lock puder ser
      # gerado no Linux (CI ou dev em Linux). Rastreado na issue #63.
      - if: needs.detectar.outputs.tem_app == 'true'
        run: npm install --no-audit --no-fund
      - name: Lint
        if: needs.detectar.outputs.tem_app == 'true'
        run: npm run lint
      - name: Typecheck
        if: needs.detectar.outputs.tem_app == 'true'
        run: npm run typecheck
      - name: Commitlint (Conventional Commits)
        if: needs.detectar.outputs.tem_app == 'true' && github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD
      - name: Testes com cobertura
        if: needs.detectar.outputs.tem_app == 'true'
        run: npm test -- --coverage
      - name: Guardar cobertura
        if: needs.detectar.outputs.tem_app == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
      - name: Somente docs — nada a testar
        if: needs.detectar.outputs.tem_app == 'false'
        run: echo "Repo em fase de documentacao (sem package.json). Job passa sem executar."

  seguranca-sast:
    name: seguranca-sast
    needs: detectar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # O gitleaks roda direto do binario oficial, nao pela action.
      # Motivo: a action deriva o intervalo de commits do evento de push, o
      # que quebra quando o intervalo comeca no commit raiz (`raiz^` nao
      # existe) e faz a varredura depender do formato do evento. Rodando o
      # binario, varremos o HISTORICO INTEIRO em toda execucao — mais forte,
      # porque pega segredo commitado em qualquer ponto do passado, e
      # deterministico.
      # A versao e fixada e o download e conferido por checksum antes de
      # executar: baixar e rodar binario sem verificar seria exatamente o
      # tipo de brecha de supply chain que este job existe para evitar.
      - name: Secret scanning (gitleaks)
        env:
          GITLEAKS_VERSAO: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum -c -
          tar -xzf "$arquivo" gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
      - name: SAST (semgrep)
        if: needs.detectar.outputs.tem_app == 'true'
        run: |
          pip install semgrep
          semgrep ci --config p/default --config p/react --config p/owasp-top-ten

  codeql:
    name: codeql
    needs: detectar
    if: needs.detectar.outputs.tem_app == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # EXCECAO DOCUMENTADA — image-size@1.2.1 (DoS por loop infinito nos
          # parsers JXL/HEIF/ICNS). Motivo de aceitar, revisado em 12/08/2026:
          #  - e dependencia transitiva do Metro, usada em tempo de BUILD para
          #    ler a dimensao dos nossos proprios assets; nao processa imagem
          #    enviada por usuaria em runtime, entao o vetor exigiria commitar
          #    uma imagem maliciosa no proprio repositorio;
          #  - nao ha correcao aplicavel: o conserto so existe no image-size 2.x,
          #    que quebra o Metro (testado — `expo export` falha com
          #    "The list argument must be an instance of SharedArrayBuffer"),
          #    e o Metro 0.84.4 e fixado pelo Expo SDK 57.
          # Remover esta linha quando o Expo subir o Metro. Rastreado na issue #62.
          allow-ghsas: GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr

  # Gera o build de preview a cada merge na main. Enquanto nao existir conta
  # Expo (segredo EXPO_TOKEN), o job avisa e termina verde em vez de falhar:
  # CI vermelho por segredo ausente, em toda merge, treina o time a ignorar
  # alerta — e ai a falha que importa passa batida.
  build-eas:
    name: build-eas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detectar.outputs.tem_app == 'true'
    needs: [detectar, qualidade, seguranca-sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: credencial
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN nao configurado — build de preview pulado. Crie a conta Expo e adicione o segredo para ativar."
          fi
      - if: steps.credencial.outputs.tem == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # Mesmo motivo do job `qualidade` (issue #63).
      - if: steps.credencial.outputs.tem == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.credencial.outputs.tem == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build preview (Android + iOS)
        if: steps.credencial.outputs.tem == 'true'
        run: eas build --profile preview --platform all --non-interactive --no-wait
